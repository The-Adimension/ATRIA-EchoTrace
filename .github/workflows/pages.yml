name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sanity-check the bundle
        run: |
          test -f showcase/index.html
          echo "index.html      $(du -h showcase/index.html | cut -f1)"
          echo "gallery PNGs    $(find showcase/gallery -name '*.png' | wc -l)"
          echo "media files     $(find showcase/media -type f | wc -l)"
          echo "bundle total    $(du -sh showcase | cut -f1)"

      # enablement:true turns Pages on via the workflow's own GITHUB_TOKEN if it is not
      # already enabled, so no manual Settings step is needed. Idempotent when it is.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      # actions/upload-pages-artifact is not usable here: it is a composite action that
      # calls actions/upload-artifact@v4 internally, unpinned, which this organisation's
      # "actions must be pinned to a full-length commit SHA" policy rejects — and a
      # transitive reference cannot be pinned from this file. These two steps do exactly
      # what it does: tar the directory, then upload it as the "github-pages" artifact
      # that actions/deploy-pages consumes.
      - name: Package the Pages artifact
        run: |
          tar --dereference --hardlink-dereference \
              --directory showcase \
              -cf "$RUNNER_TEMP/artifact.tar" .
          ls -lh "$RUNNER_TEMP/artifact.tar"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
